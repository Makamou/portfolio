<svg viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0E6D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8A45D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D1D5DB;stop-opacity:1" />
    </linearGradient>
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left V stroke - Silver -->
  <line x1="30" y1="15" x2="60" y2="80" stroke="url(#silverGrad)" stroke-width="8" stroke-linecap="round" filter="url(#logoGlow)"/>

  <!-- Right V stroke - Silver -->
  <line x1="90" y1="15" x2="60" y2="80" stroke="url(#silverGrad)" stroke-width="8" stroke-linecap="round" filter="url(#logoGlow)"/>

  <!-- Gold accent triangle - top -->
  <polygon points="55,12 75,12 68,25" fill="url(#goldGrad)" filter="url(#logoGlow)"/>

  <!-- Top accent line -->
  <line x1="25" y1="15" x2="95" y2="15" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8" filter="url(#logoGlow)"/>

  <!-- Bottom accent line -->
  <line x1="45" y1="82" x2="75" y2="82" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.7" filter="url(#logoGlow)"/>

  <!-- VERTEX Text -->
  <text x="120" y="55" font-family="Space Grotesk, system-ui, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF" letter-spacing="4">VERTEX</text>

  <!-- STUDIO Text -->
  <text x="120" y="82" font-family="Space Grotesk, system-ui, sans-serif" font-size="18" font-weight="600" fill="#C8A45D" letter-spacing="3">STUDIO</text>
</svg>