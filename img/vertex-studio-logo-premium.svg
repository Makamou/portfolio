<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0E6D2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C8A45D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A88547;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B0B0B0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Left V side - Silver -->
  <polygon points="75,50 120,150 95,150" fill="url(#silverGradient)" filter="url(#glow)" opacity="0.95"/>
  <polygon points="75,50 90,65 115,145 100,155" fill="url(#silverGradient)" filter="url(#glow)"/>

  <!-- Right V side - Silver -->
  <polygon points="165,50 120,150 145,150" fill="url(#silverGradient)" filter="url(#glow)" opacity="0.95"/>
  <polygon points="165,50 150,65 125,145 140,155" fill="url(#silverGradient)" filter="url(#glow)"/>

  <!-- Gold accent - top right triangle -->
  <polygon points="125,45 155,45 140,65" fill="url(#goldGradient)" filter="url(#glow)"/>
  <polygon points="125,50 150,50 142,62" fill="url(#goldGradient)" opacity="0.8" filter="url(#glow)"/>

  <!-- Gold accent line -->
  <line x1="70" y1="50" x2="170" y2="50" stroke="url(#goldGradient)" stroke-width="2" opacity="0.6" filter="url(#glow)"/>

  <!-- Bottom gold accent -->
  <line x1="105" y1="155" x2="135" y2="155" stroke="url(#goldGradient)" stroke-width="2.5" opacity="0.7" filter="url(#glow)"/>

  <!-- Shadow/depth element -->
  <ellipse cx="120" cy="160" rx="45" ry="8" fill="url(#silverGradient)" opacity="0.15"/>
</svg>